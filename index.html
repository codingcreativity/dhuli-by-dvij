<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Dhuli — Shayari & Poetry</title>
<meta name="description" content="Shayari and poetry in English, Hindi and Gujarati, written for Dhuli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Poppins:wght@300;400;500&family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Serif+Gujarati:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Gujarati:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b0a1f; --bg2:#1a0f33; --bg3:#2a1240;
    --gold:#e8c27a; --gold-soft:#f5dfb0; --rose:#e98ba7; --rose-deep:#b84a73;
    --ink:#f4ecff; --muted:#b9acd6;
    --glass:rgba(255,255,255,.06); --glass-b:rgba(232,194,122,.22);
    --serif:'Cormorant Garamond',Georgia,serif; --script:'Great Vibes',cursive; --sans:'Poppins',system-ui,sans-serif;
    --lh:1.6; --txt:1.38rem; --tt:2rem; --tw:400;
  }
  /* Language-aware typography: applies to the page and to individual cards/modal */
  [data-l="hi"],body[data-lang="hi"]{
    --serif:'Noto Serif Devanagari','Cormorant Garamond',serif; --script:'Noto Serif Devanagari',serif;
    --sans:'Poppins','Noto Sans Devanagari',sans-serif; --lh:1.95; --txt:1.2rem; --tt:1.5rem; --tw:600;
  }
  [data-l="gu"],body[data-lang="gu"]{
    --serif:'Noto Serif Gujarati','Cormorant Garamond',serif; --script:'Noto Serif Gujarati',serif;
    --sans:'Poppins','Noto Sans Gujarati',sans-serif; --lh:1.95; --txt:1.15rem; --tt:1.45rem; --tw:600;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--sans); color:var(--ink); min-height:100vh;
    background:radial-gradient(1200px 800px at 80% -10%,var(--bg3),transparent 60%),
               radial-gradient(900px 700px at 0% 100%,#3a0f3a55,transparent 60%),
               linear-gradient(180deg,var(--bg1),var(--bg2));
    background-attachment:fixed; overflow-x:hidden;
  }
  body.locked{overflow:hidden}
  #sky{position:fixed;inset:0;z-index:0;pointer-events:none}
  main,header,footer{position:relative;z-index:2}

  /* ---------- Intro ---------- */
  #intro{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:radial-gradient(800px 600px at 50% 40%,#2b1450,#0b0a1f 70%);
    transition:opacity 1.2s ease,visibility 1.2s;
  }
  #intro.gone{opacity:0;visibility:hidden}
  #intro .small{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.1rem,3vw,1.5rem);color:var(--muted);opacity:0;animation:fadeUp 1.6s .4s forwards}
  #intro h1{
    font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(4rem,16vw,9rem);line-height:1.1;margin:.2em 0;
    background:linear-gradient(120deg,var(--gold-soft),var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;
    min-height:1.2em;filter:drop-shadow(0 0 24px rgba(232,194,122,.35));
  }
  #intro h1 .caret{display:inline-block;width:3px;height:.8em;background:var(--gold);margin-left:4px;vertical-align:middle;animation:blink .9s infinite}
  #intro .sub{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,2.6vw,1.3rem);color:var(--gold-soft);letter-spacing:.12em;opacity:0;transition:opacity 1.5s}
  #intro .sub.show{opacity:1}
  .choose{margin-top:2rem;opacity:0;pointer-events:none;transition:opacity 1.2s}
  .choose.show{opacity:1;pointer-events:auto}
  .choose .label{font-size:.8rem;letter-spacing:.14em;color:var(--muted);margin-bottom:16px;font-family:'Poppins','Noto Sans Devanagari','Noto Sans Gujarati',sans-serif}
  .lang-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .lang-btn{
    min-width:132px;font:500 1.02rem 'Poppins','Noto Sans Devanagari','Noto Sans Gujarati',sans-serif;color:#1a0f33;
    background:linear-gradient(120deg,var(--gold-soft),var(--gold));border:0;border-radius:999px;padding:14px 30px;cursor:pointer;
    transition:transform .3s,box-shadow .3s;box-shadow:0 0 0 0 rgba(232,194,122,.5);
  }
  .choose.show .lang-btn{animation:pulse 2.6s infinite}
  .lang-btn:nth-child(2){animation-delay:.3s}.lang-btn:nth-child(3){animation-delay:.6s}
  .lang-btn:hover{transform:translateY(-3px)}
  .hint{margin-top:16px;font-size:.78rem;color:var(--muted);opacity:0;transition:opacity 1.4s}
  .hint.show{opacity:.8}

  /* ---------- Nav ---------- */
  nav{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:12px clamp(16px,4vw,48px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:linear-gradient(180deg,rgba(11,10,31,.75),rgba(11,10,31,.25));border-bottom:1px solid rgba(232,194,122,.1);
  }
  .brand{font-family:var(--script);font-size:1.9rem;color:var(--gold);font-weight:var(--tw)}
  body:not([data-lang="en"]) .brand{font-size:1.5rem}
  .nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:8px;font:400 .82rem var(--sans);color:var(--ink);cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-b);border-radius:999px;padding:9px 16px;transition:.25s;
  }
  .pill:hover{background:rgba(232,194,122,.14);transform:translateY(-1px)}
  .pill.on{background:rgba(232,194,122,.2);border-color:var(--gold)}
  .pill .count{background:var(--rose-deep);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px;min-width:20px;text-align:center}
  .langs{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-b)}
  .langs button{font:500 .8rem var(--sans);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 13px;cursor:pointer;transition:.25s}
  .langs button.active{background:linear-gradient(120deg,var(--gold-soft),var(--gold));color:#1a0f33}

  /* ---------- Hero ---------- */
  .hero{text-align:center;padding:clamp(48px,9vw,110px) 20px 36px}
  .hero .eyebrow{font-size:.78rem;letter-spacing:.35em;text-transform:uppercase;color:var(--rose)}
  .hero h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,6.4vw,4.6rem);line-height:1.2;margin:.35em 0 .3em}
  .hero h2 em{font-family:var(--script);font-style:normal;font-weight:400;color:var(--gold);font-size:1.25em}
  body:not([data-lang="en"]) .hero h2 em{font-size:1em;font-weight:600}
  .hero p{max-width:600px;margin:0 auto;color:var(--muted);font-family:var(--serif);font-size:clamp(1.05rem,2.5vw,1.35rem);font-style:italic;line-height:1.8}
  body:not([data-lang="en"]) .hero p{font-style:normal}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:28px auto 0;color:var(--gold)}
  .divider::before,.divider::after{content:"";height:1px;width:80px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider::after{transform:scaleX(-1)}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;justify-content:center;gap:10px;margin:30px 0 10px;flex-wrap:wrap;padding:0 16px}
  .tab{
    font:500 .85rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;
    background:transparent;border:1px solid transparent;border-radius:999px;padding:11px 26px;transition:.3s;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:#1a0f33;background:linear-gradient(120deg,var(--gold-soft),var(--gold));box-shadow:0 8px 30px -10px rgba(232,194,122,.6)}

  /* ---------- Cards ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:20px clamp(16px,4vw,40px) 80px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px}
  .card{
    position:relative;border-radius:22px;padding:34px 30px 24px;overflow:hidden;
    background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
    border:1px solid var(--glass-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    opacity:0;transform:translateY(34px);transition:opacity .9s ease,transform .9s ease,box-shadow .4s,border-color .4s;
    display:flex;flex-direction:column;
  }
  .card.in{opacity:1;transform:none}
  .card:hover{box-shadow:0 24px 60px -24px rgba(233,139,167,.45);border-color:rgba(232,194,122,.5)}
  .card::before{content:"“";position:absolute;top:-14px;left:18px;font-family:'Cormorant Garamond',serif;font-size:7rem;color:rgba(232,194,122,.13);line-height:1}
  .card .num{font-size:.72rem;letter-spacing:.25em;color:var(--rose);text-transform:uppercase;margin-bottom:14px;font-family:var(--sans)}
  .card .title{font-family:var(--script);font-weight:var(--tw);font-size:var(--tt);color:var(--gold);margin-bottom:8px;line-height:1.4}
  .card .text{font-family:var(--serif);font-size:var(--txt);line-height:var(--lh);font-weight:500;flex:1;color:var(--ink)}
  .card .text span{display:block}
  .card .more{font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:6px}
  .card .pen{margin-top:16px;text-align:right;font-family:var(--script);font-weight:var(--tw);font-size:1.5rem;color:var(--rose);line-height:1.3}
  [data-l="hi"] .pen,[data-l="gu"] .pen{font-size:1.15rem}
  .card .actions{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);align-items:center}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;
    background:var(--glass);border:1px solid var(--glass-b);color:var(--ink);transition:.25s;
  }
  .icon-btn:hover{background:rgba(232,194,122,.16);transform:translateY(-2px)}
  .icon-btn.fav.on{background:rgba(233,139,167,.2);border-color:var(--rose);color:var(--rose)}
  .icon-btn.fav.on svg{fill:var(--rose)}
  .icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .read{margin-left:auto;font:500 .78rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:none;border:0;cursor:pointer;padding:8px 4px}
  .read:hover{color:var(--gold-soft)}
  .section-title{grid-column:1/-1;text-align:center;font-family:var(--serif);font-size:1.5rem;font-style:italic;color:var(--muted);margin:10px 0 0}
  .empty{grid-column:1/-1;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--muted);padding:60px 0;line-height:1.8}

  /* ---------- Modal ---------- */
  #modal{
    position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;
    background:rgba(6,5,18,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #modal.open{display:flex;animation:fade .4s}
  .sheet{
    position:relative;width:min(680px,100%);max-height:88vh;overflow:auto;border-radius:26px;padding:clamp(28px,5vw,56px);
    background:linear-gradient(160deg,#241046,#150a2b);border:1px solid var(--glass-b);box-shadow:0 40px 120px -30px rgba(233,139,167,.35);text-align:center;
  }
  .sheet h3{font-family:var(--script);font-weight:var(--tw);font-size:clamp(2.2rem,6vw,3.4rem);color:var(--gold);margin-bottom:18px;line-height:1.35}
  [data-l="hi"].sheet h3,[data-l="gu"].sheet h3{font-size:clamp(1.7rem,5vw,2.4rem)}
  .sheet .lines span{display:block;font-family:var(--serif);font-size:clamp(1.1rem,3.2vw,1.45rem);line-height:var(--lh);opacity:0;animation:fadeUp .9s forwards}
  .sheet .sign{margin-top:26px;font-family:var(--script);font-size:1.8rem;color:var(--rose);font-weight:var(--tw)}
  .close{position:absolute;top:16px;right:16px}
  .sheet .actions{display:flex;justify-content:center;gap:10px;margin-top:22px}

  /* ---------- Closing ---------- */
  .closing{text-align:center;padding:60px 20px 90px}
  .closing .big{font-family:var(--script);font-size:clamp(2.6rem,8vw,5rem);color:var(--gold);font-weight:var(--tw)}
  body:not([data-lang="en"]) .closing .big{font-size:clamp(2rem,6vw,3.2rem)}
  .closing p{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--muted);max-width:540px;margin:10px auto 0;line-height:1.8}
  body:not([data-lang="en"]) .closing p{font-style:normal}
  .closing .sign{font-family:var(--script);font-size:2rem;color:var(--rose);margin-top:18px;font-weight:var(--tw)}
  footer{text-align:center;padding:26px 16px 40px;color:var(--muted);font-size:.8rem;letter-spacing:.06em;border-top:1px solid rgba(255,255,255,.06)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);z-index:120;opacity:0;pointer-events:none;
    background:linear-gradient(120deg,var(--gold-soft),var(--gold));color:#1a0f33;font-weight:500;font-size:.85rem;font-family:var(--sans);
    padding:12px 24px;border-radius:999px;transition:.4s;max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,194,122,.5)}70%{box-shadow:0 0 0 16px rgba(232,194,122,0)}100%{box-shadow:0 0 0 0 rgba(232,194,122,0)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.brand{font-size:1.5rem}.pill span.lbl{display:none}.lang-btn{min-width:110px;padding:13px 22px}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="locked" data-lang="en">

<canvas id="sky"></canvas>

<!-- Intro: name types out, then she picks a language -->
<section id="intro" aria-label="Welcome">
  <div class="small">Something written only for you…</div>
  <h1 aria-label="Dhuli"><span id="typed"></span><span class="caret"></span></h1>
  <div class="sub" id="introSub">Shayari &nbsp;·&nbsp; Poetry &nbsp;·&nbsp; One heart</div>
  <div class="choose" id="choose">
    <div class="label">Choose your language &nbsp;·&nbsp; भाषा चुनें &nbsp;·&nbsp; ભાષા પસંદ કરો</div>
    <div class="lang-row">
      <button class="lang-btn" data-pick="en">English</button>
      <button class="lang-btn" data-pick="hi">हिन्दी</button>
      <button class="lang-btn" data-pick="gu">ગુજરાતી</button>
    </div>
  </div>
  <div class="hint" id="introHint">Tip: turn your sound on for the full feeling</div>
</section>

<header>
  <nav>
    <div class="brand" data-i18n="brand">Dhuli</div>
    <div class="nav-actions">
      <div class="langs" role="group" aria-label="Language">
        <button data-lang-set="en">EN</button>
        <button data-lang-set="hi">हिं</button>
        <button data-lang-set="gu">ગુ</button>
      </div>
      <button class="pill" id="musicBtn" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="lbl" id="musicLbl">Music off</span>
      </button>
      <button class="pill" id="favBtn" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="lbl" data-i18n="favorites">Favorites</span> <span class="count" id="favCount">0</span>
      </button>
    </div>
  </nav>

  <div class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h2 data-i18n="h2"></h2>
    <p data-i18n="heroP"></p>
    <div class="divider">✦</div>
  </div>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="shayari" role="tab" data-i18n="tabShayari">Shayari</button>
    <button class="tab" data-tab="poetry" role="tab" data-i18n="tabPoetry">Poetry</button>
  </div>
  <div class="wrap"><div class="grid" id="grid"></div></div>

  <section class="closing">
    <div class="big" data-i18n="closingBig"></div>
    <p data-i18n="closingP"></p>
    <div class="sign">— <span id="fromName"></span></div>
  </section>
</main>

<footer><span data-i18n="footer"></span> &nbsp;·&nbsp; <span id="year"></span></footer>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" id="sheet">
    <button class="icon-btn close" id="mClose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h3 id="mTitle"></h3>
    <div class="lines" id="mLines"></div>
    <div class="sign" style="text-align:right"><span id="mFrom"></span></div>
    <div class="actions" id="mActions"></div>
  </div>
</div>
<div id="toast"></div>

<script>

    {t:"ગરબો", l:["જો ક્યારેક નવરાત્રિની રાતે","તું મારી સામે આવી જાય,","તો ઢોલ પણ","થોડી વાર ધબકવાનું ભૂલી જાય.","તારા ઘેરદાર ઘાઘરાનો ઘેરાવ,","ને દીવાની જ્યોતમાં તારો ચહેરો,","હું તાલ ચૂકી જાઉં તો માફ કરજે,","કારણ કે મારો તાલ","પહેલેથી તારા નામે ધબકે છે."]},
    {t:"નાની નાની વાતો", l:["તારી નાની નાની વાતો,","જેમ કે “જમ્યો?” ને “સાચવજે”,","મારા માટે આખા ગ્રંથ છે.","મોટી ભેટો ભુલાઈ જાય છે,","પણ આ નાના શબ્દો","દિવસભર સાથે ચાલે છે,","ખિસ્સામાં મૂકેલા સિક્કાની જેમ,","જે ખખડે ત્યારે","હું જાણું છું, હું ધનવાન છું."]},
    {t:"તારામંડળ", l:["રાતે અગાસીએ સૂઈને","તારા ગણું છું,","એક, બે, ત્રણ…","અને દરેક ગણતરીના અંતે","તારો ચહેરો આવે છે.","ખબર નથી,","તારા ઓછા પડે છે,","કે તારી યાદ વધુ છે.","ધુલી, તું મારું","સૌથી તેજસ્વી તારામંડળ છે."]},
    {t:"મારી પ્રાર્થના", l:["મંદિરમાં જાઉં છું ત્યારે","હવે કંઈ માંગતો નથી,","કારણ કે જે જોઈતું હતું,","તે તો તું છે,","અને તે ભગવાને","પહેલેથી આપી દીધું છે.","હું ફક્ત આભાર કહું છું,","ને તારા સુખની","એક નાની પ્રાર્થના કરું છું."]},
    {t:"આખું જીવન", l:["જ્યારે ઘડપણ આવશે,","ને હાથમાં લાકડી હશે,","ત્યારે પણ સાંજે તારી સાથે","બાંકડે બેસીને","જૂની વાતો વાગોળીશ.","તું કહીશ, “કેટલું બદલાઈ ગયું”,","ને હું કહીશ, “ના,","તું તો એવી જ છે,","જેવી પહેલી વાર જોઈ હતી.”","ધુલી, આ મારી છેલ્લી નહીં,","પહેલી ઇચ્છા છે."]}
  ]
}
};

/* ---------- Build the item list ---------- */
const LANGS = ["en","hi","gu"];
const items = [];
LANGS.forEach(lg=>{
  DATA[lg].shayari.forEach((l,i)=>items.push({id:`${lg}-s${i+1}`,lang:lg,type:"shayari",n:i+1,title:null,lines:l}));
  DATA[lg].poems.forEach((p,i)=>items.push({id:`${lg}-p${i+1}`,lang:lg,type:"poetry",n:i+1,title:p.t,lines:p.l}));
});
const byId = Object.fromEntries(items.map(i=>[i.id,i]));

/* ---------- Safe storage (migrates old English-only favorites) ---------- */
let favs = new Set();
try{
  const raw = JSON.parse(localStorage.getItem("dhuli_favs")||"[]");
  favs = new Set(raw.map(id=>id.includes("-")?id:"en-"+id).filter(id=>byId[id]));
}catch(e){}
const saveFavs = ()=>{ try{ localStorage.setItem("dhuli_favs",JSON.stringify([...favs])); }catch(e){} };

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const toastEl = $("#toast"); let toastT;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),2200); }
let currentLang="en", currentTab="shayari", showFavs=false;
const t = k => UI[currentLang][k];
const textOf = it => (it.title?it.title+"\n\n":"") + it.lines.join("\n") + `\n\n${NAMES[it.lang].pen}`;
async function copyText(it){
  try{ await navigator.clipboard.writeText(textOf(it)); toast(t("tCopied")); }
  catch(e){ toast(t("tCopyFail")); }
}
async function shareIt(it){
  if(navigator.share){ try{ await navigator.share({title:it.title||UI[it.lang].shareTitle,text:textOf(it)}); return; }catch(e){ if(e.name==="AbortError") return; } }
  copyText(it);
}
const ICONS = {
  heart:'<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>'
};

/* ---------- Render ---------- */
const grid = $("#grid");
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12});

function cardHTML(it){
  const poem = it.type==="poetry", U = UI[it.lang];
  const preview = poem ? it.lines.slice(0,4) : it.lines;
  return `
  <article class="card" data-id="${it.id}" data-l="${it.lang}">
    <div class="num">${poem?U.poem:U.shayari} · ${String(it.n).padStart(2,"0")}</div>
    ${poem?`<div class="title">${esc(it.title)}</div>`:""}
    <div class="text">${preview.map(l=>`<span>${esc(l)}</span>`).join("")}</div>
    ${poem?`<div class="more">…</div>`:""}
    <div class="pen">${NAMES[it.lang].pen}</div>
    <div class="actions">
      <button class="icon-btn fav ${favs.has(it.id)?"on":""}" data-act="fav" aria-label="Favorite">${ICONS.heart}</button>
      <button class="icon-btn" data-act="copy" aria-label="Copy">${ICONS.copy}</button>
      <button class="icon-btn" data-act="share" aria-label="Share">${ICONS.share}</button>
      ${poem?`<button class="read" data-act="read">${U.read}</button>`:""}
    </div>
  </article>`;
}
function render(){
  const list = showFavs ? items.filter(i=>favs.has(i.id)) : items.filter(i=>i.lang===currentLang && i.type===currentTab);
  grid.innerHTML = list.length
    ? (showFavs?`<div class="section-title">${t("yourFavs")}</div>`:"") + list.map(cardHTML).join("")
    : `<div class="empty">${t("empty")}</div>`;
  grid.querySelectorAll(".card").forEach((c,i)=>{ c.style.transitionDelay=(i%6)*70+"ms"; io.observe(c); });
  $("#favCount").textContent = favs.size;
  $("#favBtn").classList.toggle("on",showFavs);
  $("#favBtn").setAttribute("aria-pressed",showFavs);
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",!showFavs && b.dataset.tab===currentTab));
}
function toggleFav(id){
  favs.has(id)?favs.delete(id):favs.add(id); saveFavs();
  if(showFavs) render(); else {
    $("#favCount").textContent=favs.size;
    document.querySelectorAll(`[data-id="${id}"] .fav, #mActions .fav`).forEach(b=>b.classList.toggle("on",favs.has(id)));
  }
  toast(favs.has(id)?t("tFavAdd"):t("tFavRem"));
}

grid.addEventListener("click",e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const it = byId[b.closest(".card").dataset.id];
  ({fav:()=>toggleFav(it.id),copy:()=>copyText(it),share:()=>shareIt(it),read:()=>openModal(it)})[b.dataset.act]();
});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ currentTab=b.dataset.tab; showFavs=false; render(); });
$("#favBtn").onclick=()=>{ showFavs=!showFavs; render(); };

/* ---------- Language ---------- */
function applyLang(lg){
  currentLang = lg;
  document.body.dataset.lang = lg;
  document.documentElement.lang = lg;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = UI[lg][el.dataset.i18n]; });
  document.querySelectorAll("[data-lang-set]").forEach(b=>b.classList.toggle("active",b.dataset.langSet===lg));
  $("#fromName").textContent = NAMES[lg].you;
  document.title = lg==="en" ? "For Dhuli — Shayari & Poetry" : `${NAMES[lg].her} — ${UI[lg].tabShayari} · ${UI[lg].tabPoetry}`;
  setMusicUI();
  render();
}
document.querySelectorAll("[data-lang-set]").forEach(b=>b.onclick=()=>{ if(modal.classList.contains("open")) closeModal(); applyLang(b.dataset.langSet); window.scrollTo({top:0,behavior:"smooth"}); });

/* ---------- Modal ---------- */
const modal=$("#modal");
function openModal(it){
  $("#sheet").dataset.l = it.lang;
  $("#mTitle").textContent = it.title;
  $("#mFrom").textContent = NAMES[it.lang].pen;
  $("#mLines").innerHTML = it.lines.map((l,i)=>`<span style="animation-delay:${.15+i*.28}s">${esc(l)}</span>`).join("");
  $("#mActions").innerHTML = `
    <button class="icon-btn fav ${favs.has(it.id)?"on":""}" aria-label="Favorite">${ICONS.heart}</button>
    <button class="icon-btn" data-c aria-label="Copy">${ICONS.copy}</button>
    <button class="icon-btn" data-s aria-label="Share">${ICONS.share}</button>`;
  const a=$("#mActions");
  a.querySelector(".fav").onclick=()=>toggleFav(it.id);
  a.querySelector("[data-c]").onclick=()=>copyText(it);
  a.querySelector("[data-s]").onclick=()=>shareIt(it);
  modal.classList.add("open"); document.body.classList.add("locked");
  $("#mClose").focus();
}
function closeModal(){ modal.classList.remove("open"); document.body.classList.remove("locked"); }
$("#mClose").onclick=closeModal;
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
$("#year").textContent = new Date().getFullYear();

/* ---------- Intro: type her name, then choose a language ---------- */
(function intro(){
  const el=$("#typed"), name=NAMES.en.her; let i=0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function type(){
    el.textContent = name.slice(0,++i);
    if(i<name.length) setTimeout(type,260);
    else setTimeout(()=>{ $("#introSub").classList.add("show"); setTimeout(()=>{ $("#choose").classList.add("show"); $("#introHint").classList.add("show"); },900); },500);
  }
  setTimeout(type, reduce?0:1500);
})();
document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
  applyLang(b.dataset.pick);
  $("#intro").classList.add("gone");
  document.body.classList.remove("locked");
  startMusic(); burstPetals();
  setTimeout(()=>$("#intro").remove(),1400);
});

/* ---------- Music (built-in ambient, or your own file) ---------- */
let music = {on:false,ctx:null,master:null,timer:null,audio:null};
const CHORDS=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]];
function pad(freqs,tm,dur){
  const {ctx,master}=music;
  freqs.forEach((f,i)=>{
    [0,6].forEach(det=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
      o.type=i%2?"triangle":"sine"; o.frequency.value=f; o.detune.value=det-3;
      lp.type="lowpass"; lp.frequency.value=1100;
      g.gain.setValueAtTime(0,tm);
      g.gain.linearRampToValueAtTime(.05,tm+dur*.45);
      g.gain.linearRampToValueAtTime(0,tm+dur+1.5);
      o.connect(lp).connect(g).connect(master);
      o.start(tm); o.stop(tm+dur+1.6);
    });
  });
}
function startMusic(){
  if(music.on) return;
  try{
    if(MUSIC_URL){
      music.audio = music.audio || Object.assign(new Audio(MUSIC_URL),{loop:true,volume:.5});
      music.audio.play().catch(()=>{});
    }else{
      const AC=window.AudioContext||window.webkitAudioContext;
      music.ctx = music.ctx || new AC();
      music.ctx.resume();
      if(!music.master){ music.master=music.ctx.createGain(); music.master.gain.value=0; music.master.connect(music.ctx.destination); }
      music.master.gain.cancelScheduledValues(music.ctx.currentTime);
      music.master.gain.linearRampToValueAtTime(1,music.ctx.currentTime+2);
      let k=0; const step=()=>{ pad(CHORDS[k++%CHORDS.length],music.ctx.currentTime+.05,4.2); };
      step(); music.timer=setInterval(step,4000);
    }
    music.on=true; setMusicUI();
  }catch(e){ music.on=false; setMusicUI(); }
}
function stopMusic(){
  if(MUSIC_URL){ music.audio&&music.audio.pause(); }
  else if(music.ctx){
    clearInterval(music.timer);
    music.master.gain.cancelScheduledValues(music.ctx.currentTime);
    music.master.gain.linearRampToValueAtTime(0,music.ctx.currentTime+1);
  }
  music.on=false; setMusicUI();
}
function setMusicUI(){
  $("#musicLbl").textContent = music.on?t("musicOn"):t("musicOff");
  $("#musicBtn").classList.toggle("on",music.on);
  $("#musicBtn").setAttribute("aria-pressed",music.on);
}
$("#musicBtn").onclick=()=> music.on?stopMusic():startMusic();

/* ---------- Starfield + petals ---------- */
const cv=$("#sky"), cx=cv.getContext("2d");
let W,H,stars=[],petals=[],shooting=null,dpr=Math.min(devicePixelRatio||1,2);
function resize(){
  W=innerWidth;H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; cx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:.4+Math.random()*1.4}));
}
function newPetal(top=true){
  return {x:Math.random()*W,y:top?-20:Math.random()*H,s:6+Math.random()*9,vy:.35+Math.random()*.7,vx:-.2+Math.random()*.6,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,sw:Math.random()*6.28,hue:Math.random()<.7?340:42,a:.35+Math.random()*.45};
}
function burstPetals(){ for(let i=0;i<60;i++){ const p=newPetal(); p.y=-Math.random()*H*.6; petals.push(p); } }
function drawPetal(p){
  cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=p.a;
  cx.fillStyle = p.hue===340?"#e98ba7":"#e8c27a";
  cx.beginPath(); cx.moveTo(0,-p.s); cx.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.7,0,p.s); cx.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s); cx.fill(); cx.restore();
}
function frame(ts){
  cx.clearRect(0,0,W,H);
  for(const s of stars){ const a=.35+.65*Math.abs(Math.sin(ts/1000*s.s+s.p)); cx.globalAlpha=a; cx.fillStyle="#fff"; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.28); cx.fill(); }
  if(!shooting && Math.random()<.002) shooting={x:Math.random()*W*.7+W*.2,y:Math.random()*H*.3,l:0};
  if(shooting){ shooting.x-=9; shooting.y+=4.5; shooting.l++; const g=cx.createLinearGradient(shooting.x,shooting.y,shooting.x+90,shooting.y-45);
    g.addColorStop(0,"rgba(255,240,200,.9)"); g.addColorStop(1,"rgba(255,240,200,0)"); cx.globalAlpha=1; cx.strokeStyle=g; cx.lineWidth=1.6;
    cx.beginPath(); cx.moveTo(shooting.x,shooting.y); cx.lineTo(shooting.x+90,shooting.y-45); cx.stroke(); if(shooting.l>70) shooting=null; }
  if(petals.length<26 && Math.random()<.05) petals.push(newPetal());
  petals=petals.filter(p=>p.y<H+30);
  for(const p of petals){ p.sw+=.02; p.x+=p.vx+Math.sin(p.sw)*.5; p.y+=p.vy; p.rot+=p.vr; drawPetal(p); }
  requestAnimationFrame(frame);
}
addEventListener("resize",resize); resize();
for(let i=0;i<14;i++) petals.push(newPetal(false));
if(!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(frame);

applyLang("en");
</script>
